{% load i18n %}<form method="get" class="filters">
  {% if options %}<select name="stock" aria-label="{% trans 'Item' %}">{% for v, label in options %}<option value="{{ v }}" {% if v == choice %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% endif %}
  <label>{% trans "From" %} <input type="date" name="from" value="{{ d_from|date:'Y-m-d' }}"></label>
  <label>{% trans "To" %} <input type="date" name="to" value="{{ d_to|date:'Y-m-d' }}"></label>
  <button class="btn small" type="submit">{% trans "Apply" %}</button>
  <button class="btn small" name="export" value="csv" type="submit">CSV</button>
  <button class="btn small" name="export" value="xlsx" type="submit">Excel</button>
</form>
