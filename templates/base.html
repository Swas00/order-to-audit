<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#b45309">
  <title>{% block title %}Order-to-Audit{% endblock %}</title>
  <style>
    :root { --fg:#1f2933; --bg:#f5f7fa; --card:#fff; --accent:#b45309; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; color:var(--fg); background:var(--bg); }
    header { display:flex; flex-wrap:wrap; gap:6px 12px; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--accent); color:#fff; }
    header a, header button { color:#fff; background:none; border:0; font:inherit; cursor:pointer; text-decoration:underline; }
    main { max-width:960px; margin:0 auto; padding:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
    label { display:block; margin:12px 0 4px; font-weight:600; }
    input { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:6px; }
    .btn { margin-top:16px; width:100%; padding:12px; font-size:16px; background:var(--accent); color:#fff; border:0; border-radius:6px; cursor:pointer; }
    .error { color:#b91c1c; } .sync { padding:10px 12px; border-radius:6px; margin:0 0 12px; background:#ecfdf5; color:#166534; } .sync.warn { background:#fffbeb; color:#92400e; } .pending { margin-bottom:8px; } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; } .big { font-size:28px; font-weight:700; margin:4px 0; } .muted { color:#52606d; font-weight:400; font-size:13px; } tr.short td { background:#fef2f2; } select { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:6px; } .st-flag { color:#b91c1c; font-weight:700; } .st-note { color:#92400e; } .st-ok { color:#166534; }
    .btn.small { width:auto; margin:0; padding:8px 12px; text-decoration:none; display:inline-block; }
    .filters { display:flex; flex-wrap:wrap; gap:8px; align-items:end; margin-bottom:12px; }
    .filters input, .filters select { width:auto; padding:8px; }
    .scroll { overflow-x:auto; } table { border-collapse:collapse; width:100%; background:#fff; }
    th, td { border:1px solid var(--line); padding:6px 8px; text-align:left; font-size:14px; }
    fieldset { margin:12px 0; border:1px solid var(--line); } .messages { list-style:none; padding:0; color:#166534; }
  </style>
</head>
<body>
  <header>
    <strong><a href="/" style="text-decoration:none">Order-to-Audit</a></strong>
    {% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}
      {{ user.get_full_name|default:user.username }} ({{ user.get_role_display }}) <button type="submit">Log out</button>
    </form>
    {% endif %}
  </header>
  <main>{% if messages %}<ul class="messages">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>{% endif %}{% block content %}{% endblock %}</main>
</body>
</html>
